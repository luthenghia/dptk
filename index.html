<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đấu Phá Thương Khung · Tiêu Viêm (Bản Trọn Vẹn)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ========================================================== -->
<!-- 1. CSS GIAO DIỆN & HIỆU ỨNG (STYLES)                       -->
<!-- ========================================================== -->
<style>
:root{
  --bg:#f4ece1;--pn:#e8dcbe;--ink:#23180d;--mut:#756143;--gd:#b47818;--hp:#c0392b;--mp:#2574a9;--xp:#d97706;--bd:#bfa26b;
  --q0:#8a8a8a;--q1:#d97706;--q2:#8b5cf6;--q3:#e11d48;--q4:#f59e0b;--q5:#ec4899;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15100b;--pn:#241a12;--ink:#f3e8d2;--mut:#a49372;--gd:#e5b45b;--bd:#5e482b}
}
:root[data-theme="dark"]{--bg:#15100b;--pn:#241a12;--ink:#f3e8d2;--mut:#a49372;--gd:#e5b45b;--bd:#5e482b}
*{box-sizing:border-box}

html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh; user-select:none;-webkit-user-select:none;}
#app{width:100%;max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

header{padding:10px 14px;background:var(--pn);border-bottom:2px solid var(--bd);position:relative;z-index:20;min-height:68px}
header .r{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bar{height:9px;background:rgba(0,0,0,.22);border-radius:5px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;width:0;transition:width .3s}
small{color:var(--mut)}main{flex:1;padding:10px;padding-bottom:120px}

nav.bot-nav{
  position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:auto;
  background:var(--pn);border-top:2px solid var(--bd);z-index:25;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,auto);
  box-shadow:0 -4px 12px rgba(0,0,0,.15);
}
nav.bot-nav button{
  padding:8px 2px;border:0;background:none;color:var(--ink);
  font:inherit;font-size:11px;font-weight:600;text-align:center;border-radius:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
nav.bot-nav button.on{color:var(--gd);background:rgba(180,120,24,.14);border-top:2px solid var(--gd)}

.card{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px;line-height:1.55;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--pn);color:var(--ink);border-radius:6px;padding:4px 8px;font-weight:500;transition:.15s}
button:active{transform:scale(.97)}
.pri{background:var(--gd);color:#fff;border:0;padding:9px 14px;font-weight:700;width:100%;margin:6px 0;border-radius:6px}
.ghost{width:100%;opacity:.75}
.zs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.zb.on{background:var(--gd);color:#fff;font-weight:700}
.arena{display:flex;align-items:center;gap:6px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px;min-height:160px}
.unit{flex:1;text-align:center;position:relative;min-width:0}.em{font-size:44px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:clip}.vs{font-size:20px;font-weight:800;color:var(--mut)}
.fl-w{position:absolute;left:0;right:0;top:0;pointer-events:none}
.fl{position:absolute;left:50%;top:5px;font-weight:800;color:var(--hp);animation:up .9s forwards;white-space:nowrap;text-shadow:1px 1px 2px rgba(0,0,0,0.5)}.fl.cr{color:var(--xp);font-size:20px}.fl.hl{color:#2a9d4a}.fl.md{color:#b03a8a}
@keyframes up{to{transform:translate(-50%,-55px);opacity:0}}
.log{font-size:12.5px;color:var(--mut);margin-top:8px;height:125px;overflow:hidden;line-height:1.5;border-top:1px dashed var(--bd);padding-top:6px}
.sl{padding:5px 0;border-bottom:1px dashed var(--bd);display:flex;justify-content:space-between;align-items:center;gap:6px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.it{border:2px solid;border-radius:7px;padding:4px;text-align:center;font-size:18px;cursor:pointer;position:relative;background:rgba(0,0,0,.03);transition:.15s}
.it small{font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.it .lk-icon{position:absolute;top:2px;right:3px;font-size:10px}

/* ====== PHÂN CẤP HIỆU ỨNG TRANG BỊ & CHỮ ====== */
.it.q-2{box-shadow:0 0 6px rgba(139,92,246,.5)}
.it.q-3{border-color:#e11d48 !important;animation:diaGlow 2.2s infinite alternate ease-in-out;}
@keyframes diaGlow{0%{box-shadow:0 0 5px #e11d48,inset 0 0 3px rgba(225,29,72,.3);border-color:#e11d48}50%{box-shadow:0 0 12px #8b5cf6,inset 0 0 6px rgba(139,92,246,.4);border-color:#a855f7}100%{box-shadow:0 0 16px #e11d48,0 0 6px #f43f5e,inset 0 0 8px rgba(225,29,72,.6);border-color:#f43f5e}}
.it.q-4,.it.q-5{border-color:#f59e0b !important;animation:thienGlow 1.6s infinite alternate ease-in-out;}
@keyframes thienGlow{0%{box-shadow:0 0 10px #f59e0b,inset 0 0 6px rgba(245,158,11,.5);border-color:#f59e0b}50%{box-shadow:0 0 20px #ef4444,0 0 8px #f59e0b,inset 0 0 10px rgba(239,68,68,.6);border-color:#fbbf24}100%{box-shadow:0 0 26px #ff0055,0 0 14px #fbbf24,inset 0 0 14px rgba(255,255,255,.8);border-color:#ffffff}}

/* CSS Gradient động bằng RequestAnimationFrame */
.txt-q1, .txt-q2, .txt-q3, .txt-q4, .txt-q5, .rb-txt, 
.p-txt4, .p-txt5, .p-txt6, .p-txt7, .p-txt8,
.f-txt1, .f-txt2, .f-txt3, .f-txt4, .f-txt5, .f-txt6, .f-txt7 {
    background-position: var(--bg-x, 0%) 50% !important;
}

.txt-q0 { color: #8a8a8a; }
.txt-q1 { background: linear-gradient(90deg, #16a34a, #4ade80, #16a34a); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.txt-q2 { background: linear-gradient(90deg, #8b5cf6, #c4b5fd, #8b5cf6); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.txt-q3 { background: linear-gradient(90deg, #e11d48, #fda4af, #e11d48); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.txt-q4 { background: linear-gradient(90deg, #f59e0b, #fde047, #f59e0b); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.txt-q5 { background: linear-gradient(90deg, #ec4899, #f9a8d4, #ec4899); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
.rb-txt { background: linear-gradient(90deg, #ff0000, #ff7f00, #eedd00, #00ff00, #00bbff, #8b00ff, #ff0000); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }

/* ====== HIỆU ỨNG ĐAN DƯỢC (1-9 PHẨM) ====== */
.p-txt0 { color: #22c55e; font-weight: 600; } /* Nhất */
.p-txt1 { color: #0ea5e9; font-weight: 600; } /* Nhị */
.p-txt2 { color: #a855f7; font-weight: 600; } /* Tam */
.p-txt3 { color: #f59e0b; text-shadow: 0 0 5px rgba(245,158,11,0.4); font-weight: 700; } /* Tứ */
.p-txt4 { background: linear-gradient(90deg, #ef4444, #f87171, #ef4444); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; } /* Ngũ */
.p-txt5 { background: linear-gradient(90deg, #10b981, #34d399, #10b981); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; filter: drop-shadow(0 0 3px rgba(16,185,129,0.5)); } /* Lục */
.p-txt6 { background: linear-gradient(90deg, #8b5cf6, #d946ef, #8b5cf6); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; filter: drop-shadow(0 0 4px rgba(217,70,239,0.6)); } /* Thất */
.p-txt7 { background: linear-gradient(90deg, #f43f5e, #fbbf24, #f43f5e); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; filter: drop-shadow(0 0 5px rgba(244,63,94,0.7)); } /* Bát */
.p-txt8 { background: linear-gradient(90deg, #ff0055, #fbbf24, #00ffaa, #00bbff, #8b00ff, #ff0055); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); } /* Cửu */

/* ====== HIỆU ỨNG DỊ HỎA (7 TIER ĐỘC LẬP) ====== */
.f-t1 { border-color: #65a30d !important; box-shadow: 0 0 8px rgba(101, 163, 13, 0.4); }
.f-txt1 { background: linear-gradient(90deg, #65a30d, #d9f99d, #65a30d); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;}
.f-t2 { border-color: #0ea5e9 !important; box-shadow: 0 0 8px rgba(14, 165, 233, 0.4); }
.f-txt2 { background: linear-gradient(90deg, #0ea5e9, #bae6fd, #0ea5e9); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;}
.f-t3 { border-color: #6366f1 !important; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
.f-txt3 { background: linear-gradient(90deg, #4f46e5, #c7d2fe, #4f46e5); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;}
.f-t4 { border-color: #d946ef !important; box-shadow: 0 0 12px rgba(217, 70, 239, 0.6); }
.f-txt4 { background: linear-gradient(90deg, #d946ef, #f5d0fe, #d946ef); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;}
.f-t5 { border-color: #f43f5e !important; box-shadow: 0 0 14px rgba(244, 63, 94, 0.7); animation: pulse-f5 2s infinite alternate; }
@keyframes pulse-f5 { 0% {box-shadow: 0 0 10px #f43f5e} 100% {box-shadow: 0 0 20px #fbbf24, inset 0 0 10px rgba(251,191,36,0.5)} }
.f-txt5 { background: linear-gradient(90deg, #e11d48, #fbbf24, #e11d48); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
.f-t6 { border-color: #e879f9 !important; box-shadow: 0 0 18px rgba(232, 121, 249, 0.8); animation: pulse-f6 1.5s infinite alternate; }
@keyframes pulse-f6 { 0% {box-shadow: 0 0 12px #e879f9, inset 0 0 8px #a855f7} 100% {box-shadow: 0 0 25px #ffffff, inset 0 0 15px #e879f9} }
.f-txt6 { background: linear-gradient(90deg, #e879f9, #ffffff, #a855f7, #ffffff, #e879f9); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
.de-viem-card {
    position: relative;
    border: none !important;
    padding: 12px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    margin-bottom: 10px;
}
.de-viem-card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: conic-gradient(from var(--rot-deg, 0deg), transparent, transparent, #ff0055, #fbbf24, #ff0055, transparent, transparent);
    z-index: 0;
}
.de-viem-card::after {
    content: '';
    position: absolute;
    inset: 3px;
    background: var(--pn);
    border-radius: 5px;
    z-index: 1;
}
.de-viem-content { position: relative; z-index: 2; }
.f-txt7 {
    background: linear-gradient(90deg, #ff0055, #fbbf24, #00ffaa, #00bbff, #8b00ff, #ff0055);
    background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 900; font-size: 1.15em;
}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:16px;z-index:35}#ov[hidden]{display:none}
.box{background:var(--pn);border:2px solid var(--gd);border-radius:10px;max-width:480px;width:100%;padding:14px;line-height:1.6;max-height:85vh;overflow-y:auto}
.box b{color:var(--gd)}

/* Tooltip (Hover) bám chuột */
#tp{position:fixed; z-index:9999; background:var(--pn); border:2px solid var(--gd); border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.5; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.35); width:max-content; max-width:calc(100vw - 20px); word-wrap:break-word}
#tp[hidden]{display:none}
[data-tip]{cursor:help}

#ts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:6px 16px;border-radius:20px;z-index:40;opacity:0;transition:.3s;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none !important}
#ts.on{opacity:1}

.flash{position:fixed;inset:0;background:radial-gradient(circle,#ffd27a,#ff7a2a 65%,transparent);animation:fl 1.2s forwards;z-index:32;pointer-events:none}@keyframes fl{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
.shake{animation:sk .3s ease-in-out}@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.mat-tag{display:inline-block;padding:2px 6px;border-radius:4px;border:1px solid var(--bd);font-size:11px;margin:2px;cursor:pointer}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}

/* Fullscreen Effect Luyện Đan Bậc Cao */
.craft-fx { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; overflow:hidden; }
.craft-fx .c-bg { position:absolute; inset:-50%; animation: c-pulse 2s forwards; opacity: 0; mix-blend-mode: screen; }
.craft-fx .c-txt { position:relative; z-index:2; text-align:center; animation: c-text-pop 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
.craft-fx h2 { font-size: 24px; color: #fff; margin:0 0 10px 0; }
.craft-fx h1 { font-size: 38px; margin:0; line-height:1.2; padding: 0 20px;}
@keyframes c-pulse { 0% {transform: scale(0.5); opacity: 0;} 20% {transform: scale(1); opacity: 0.9;} 80% {transform: scale(1.1); opacity: 0.8;} 100% {transform: scale(1.5); opacity: 0;} }
@keyframes c-text-pop { 0% {transform: scale(0.1) translateY(50px); opacity: 0;} 15% {transform: scale(1.2) translateY(0); opacity: 1;} 25% {transform: scale(1);} 80% {transform: scale(1) translateY(0); opacity: 1;} 100% {transform: scale(1.5) translateY(-50px); opacity: 0;} }

/* Con trỏ chuột tùy biến */
body.cur-default, body.cur-default *{cursor:default !important}
body.cur-default button, body.cur-default [data-a], body.cur-default .it{cursor:pointer !important}
body.cur-xich, body.cur-xich *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M4 28 L28 4 L24 2 L2 24 Z" fill="%231a1a1a" stroke="%23c0392b" stroke-width="2"/><circle cx="5" cy="27" r="3" fill="%23c0392b"/></svg>') 4 28, auto !important}
body.cur-thanhlien, body.cur-thanhlien *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 2 C10 12 4 16 8 26 C12 32 20 32 24 26 C28 16 22 12 16 2 Z" fill="%2322c55e" stroke="%2314532d" stroke-width="2"/><circle cx="16" cy="22" r="4" fill="%2386efac"/></svg>') 16 2, auto !important}
body.cur-vanlac, body.cur-vanlac *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 2 C12 10 2 16 6 26 C10 32 22 32 26 26 C30 16 20 10 16 2 Z" fill="%23f97316" stroke="%237c2d12" stroke-width="2"/><path d="M16 8 C14 14 8 18 10 24 C13 28 19 28 22 24 Z" fill="%23fde047"/></svg>') 16 2, auto !important}
body.cur-cotu, body.cur-cotu *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 2 C10 12 2 16 6 26 C10 32 22 32 26 26 C30 16 22 12 16 2 Z" fill="%2338bdf8" stroke="%23ffffff" stroke-width="2"/><circle cx="16" cy="20" r="5" fill="%23ffffff"/></svg>') 16 2, auto !important}
body.cur-devien, body.cur-devien *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="16,1 20,11 31,12 23,19 25,30 16,24 7,30 9,19 1,12 12,11" fill="%23eab308" stroke="%23ea580c" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="%23ffffff"/></svg>') 16 16, auto !important}
</style></head><body class="cur-default">

<!-- 2. KHUNG HTML GIAO DIỆN CHÍNH (LAYOUT)                     -->
<!-- ========================================================== -->
<div id="app">
<header>
  <div class="r">
    <div style="display:flex;align-items:center;gap:6px">
      <b id="hdr_name">Tiêu Viêm</b> <small id="diff_tag" style="font-weight:700"></small>
      <button type="button" data-a="tgsnd" id="btn_snd" style="padding:2px 7px;font-size:12px;font-weight:700">🔊</button>
      <button type="button" data-a="tab" data-v="setting" style="padding:2px 8px;font-size:11px;font-weight:700;background:var(--gd);color:#fff">⚙️ Thiết lập</button>
    </div>
    <span id="rl" style="font-weight:700"></span>
  </div>
  <div class="bar"><i id="xb" style="background:var(--xp)"></i></div>
  <div class="r"><small id="xt"></small><small id="gd"></small></div>
</header>

<main id="main"></main>

<nav class="bot-nav">
  <button data-a="tab" data-v="fight"><span>⚔️</span>Chiến đấu</button>
  <button data-a="tab" data-v="hero"><span>🧒</span>Nhân vật</button>
  <button data-a="tab" data-v="skl"><span>🌀</span>Đấu kỹ</button>
  <button data-a="tab" data-v="alc"><span>⚗️</span>Luyện đan</button>
  <button data-a="tab" data-v="fire"><span>🔥</span>Dị hỏa</button>
  <button data-a="tab" data-v="pet"><span>🐾</span>Ma thú</button>
  <button data-a="tab" data-v="quest"><span>📜</span>Nhiệm vụ</button>
  <button data-a="tab" data-v="story"><span>📚</span>Tàng thư</button>
</nav>
</div>
<div id="tp" hidden></div><div id="ov" hidden></div><div id="ts"></div>

<!-- Input File để Load Save Dữ Liệu Ẩn -->
<input type="file" id="load_file" style="display:none" accept=".json">

<!-- ========================================================== -->
<!-- 3. HỆ THỐNG CỐT LÕI (CORE ENGINE)                          -->
<!-- ========================================================== -->
<script id="core">
(()=>{
// Khởi chạy Animation độc lập 60FPS bằng JS
let bgX = 0, rotDeg = 0;
function runGradientAnim() {
    bgX = (bgX - 0.7) % 200;
    rotDeg = (rotDeg + 1.5) % 360;
    document.documentElement.style.setProperty('--bg-x', bgX + '%');
    document.documentElement.style.setProperty('--rot-deg', rotDeg + 'deg');
    requestAnimationFrame(runGradientAnim);
}
requestAnimationFrame(runGradientAnim);

const $=id=>document.getElementById(id);
const R=['Đấu Chi Khí','Đấu Giả','Đấu Sư','Đại Đấu Sư','Đấu Linh','Đấu Vương','Đấu Hoàng','Đấu Tông','Đấu Tôn','Bán Thánh','Đấu Thánh','Đấu Đế'];
const QN=['Phàm','Hoàng','Huyền','Địa','Thiên','Thần','Thần'],QM=[1,1.4,2.2,3.4,5.2,7.5,10];

  const m=QM[q],ss=SETS.map((x,i)=>[x,i]).filter(a=>a[0].t==t),k=KS[slot];
  const it={id:S.uid++,s:slot,q,t,e:0,x:{},lock:0};
  if(ss.length&&Math.random()<.48)it.set=ss[rnd(0,ss.length-1)][1];
  it.n=QN[q]+' '+(it.set!=null?SETS[it.set].n+' · '+SL[slot]:NM[slot][Math.min(t-1,NM[slot].length-1)]);

function give(it,isAfk){

    S.inv.push(it);if(!isAfk){log('🎒 Nhặt: '+it.n);snd('drop');}

function epicCraftFx(tier, name, isFine) {
    const colors = ['','','','','','#10b981','#8b5cf6','#f43f5e','#fbbf24']; 
    const tName = PL_QN[tier];
    const div = document.createElement('div');
    div.className = `craft-fx`;
    div.innerHTML = `
        <div class="c-bg" style="background: radial-gradient(circle, ${colors[tier]} 0%, transparent 70%)"></div>
        <div class="c-txt">
            <h2>✨ ĐAN THÀNH! ✨</h2>
            <h1 class="p-txt${tier}">[${tName}]<br>${name} ${isFine?'<br><small>(Thượng Phẩm)</small>':''}</h1>
        </div>
    `;
    document.body.appendChild(div);

    if(S.snd && actx) {
        const cur = actx.currentTime;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = tier >= 7 ? 'sawtooth' : 'square';
        o.frequency.setValueAtTime(110 * (tier-3), cur);
        o.frequency.exponentialRampToValueAtTime(880 * (tier-4), cur + 0.8);
        g.gain.setValueAtTime(0.2, cur);
        g.gain.exponentialRampToValueAtTime(0.01, cur + 1.5);
        o.connect(g); g.connect(actx.destination);
        o.start(cur); o.stop(cur + 1.5);
        
        if (tier >= 7) {
            const low = actx.createOscillator(); low.type = 'sine';
            low.frequency.setValueAtTime(50, cur);
            low.frequency.linearRampToValueAtTime(20, cur + 1.5);
            const lowG = actx.createGain(); lowG.gain.setValueAtTime(0.4, cur); lowG.gain.linearRampToValueAtTime(0, cur+1.5);
            low.connect(lowG); lowG.connect(actx.destination);
            low.start(cur); low.stop(cur+1.5);
        }
    }
    setTimeout(() => div.remove(), 2500);
}

function spawn(){
  let z = Z.find(z=>z.id==S.zone);
  if(!z) { z = Z[0]; S.zone = z.id; }
  
  let validMobs = z.mobs;
  if(z.id === 'vanthu') {
      validMobs = z.mobs.filter(mid => {
          const mObj = M[mid];
          if(!mObj) return false;
          const ml = mObj.g[0] - 2; 
          return S.L >= ml - 8; 
      });
      if(!validMobs.length) validMobs = [z.mobs[0]];
  }
  const id = validMobs[rnd(0, validMobs.length-1)];
  const m = M[id];
  
  const df=DIFF_DATA[S.diff||1];
  let isSwarm = false, isElite = false;
  let petM = 1.0, aMod = 1.0, hMod = 1.0, xMod = 1.0;
  let namePref = "", emMod = m.e;
  
  if (S.actPet) {
      const r = Math.random();
      if (r < 0.15) {
          isSwarm = true; namePref = "<span style='color:#e11d48'>Bầy Đàn</span> "; emMod = m.e+m.e+m.e; hMod = 2.5; aMod = 1.6; xMod = 2.5;
      } else if (r < 0.35) {
          isElite = true; namePref = "<span style='color:#8b5cf6'>Cường Hóa</span> "; hMod = 1.8; aMod = 1.3; xMod = 1.8;
      } else {
          petM = 1.2; 
      }
  }

  const hp=Math.round(m.hp * df.hpM * petM * hMod);
  mob = {
    ...m, hp, max: hp,
    n: namePref + m.n,
    e: emMod,
    a: Math.round(m.a * df.atkM * (S.actPet ? 1.2 : 1) * aMod),
    d: Math.round(m.d * df.defM),
    x: Math.round(m.x * xMod),
    g: [Math.round(m.g[0] * xMod), Math.round(m.g[1] * xMod)]
  };
}

function genRandomReward(){
  const gold = 2000 + Math.floor(Math.random() * 4000);
  const exp = 1500 + Math.floor(Math.random() * 3000);
  const rwTypes = ['mat', 'pill', 'cage', 'mahach'];
  const picked = rwTypes[Math.floor(Math.random() * rwTypes.length)];
  const rw = { gold, exp };
  
  if(picked === 'mat'){
    const mats = [
      { id: 'tt', n: 'Thanh Tâm Thảo', c: 3 },
      { id: 'xd', n: 'Xà Đảm', c: 2 },
      { id: 'pl', n: 'Phong Linh Thảo', c: 2 },
      { id: 'hv', n: 'Huyết Vân Thảo', c: 2 },
      { id: 'tc', n: 'Thiên Cương Thảo', c: 2 }
    ];
    rw.mat = mats[Math.floor(Math.random() * mats.length)];
  } else if(picked === 'pill'){
    const pills = [
      { id: 'hq', n: 'Hồi Huyết Đan', c: 2 },
      { id: 'tkt', n: 'Tụ Khí Tán', c: 1 },
      { id: 'cth', n: 'Cường Thể Đan', c: 1 },
      { id: 'btd', n: 'Băng Tâm Đan', c: 1 }
    ];
    rw.pill = pills[Math.floor(Math.random() * pills.length)];
  } else if(picked === 'cage'){
    rw.cages = 1 + Math.floor(Math.random() * 2);
  } else if(picked === 'mahach'){
    rw.mahach = 2 + Math.floor(Math.random() * 3);
  }
  return rw;
}

function chk(){
  const q=Q[S.qi];if(!q||S.qs!='active')return;
  const g=q.goal;
  if(g.t=='lv'?S.L>=g.v:S.pr>=g.n){S.qs='ready';toast('📜 Nhiệm vụ chính hoàn thành!');snd('up')}

function chkSide(type, target, amt){
  if(!S.dailyQuests) return;
  S.dailyQuests.forEach(sq => {
    if(S.sideDone[sq.id]) return;
    const matchType = (sq.t === type);
    const matchTarget = (!sq.target || sq.target === target);
    if(matchType && matchTarget){
      S.sidePr[sq.id] = (S.sidePr[sq.id] || 0) + (amt || 1);
      if(S.sidePr[sq.id] >= sq.n){
        S.sideDone[sq.id] = 1;
        S.gold += sq.rw.gold || 0;
        addExp(sq.rw.exp || 0);
        if(sq.rw.mat) S.mat[sq.rw.mat.id] = (S.mat[sq.rw.mat.id] || 0) + sq.rw.mat.c;
        if(sq.rw.pill) S.pl[sq.rw.pill.id] = (S.pl[sq.rw.pill.id] || 0) + sq.rw.pill.c;
        if(sq.rw.cages) S.cages = (S.cages || 0) + sq.rw.cages;
        if(sq.rw.mahach) S.mat['mahach'] = (S.mat['mahach'] || 0) + sq.rw.mahach;
        S.actPoint = Math.min(100, (S.actPoint || 0) + 25);
        toast(`🎖️ Hoàn thành: ${sq.name} (+25 Năng Động)!`);
        snd('up');
      }
    }
  });
}

function kill(){
  const z=Z.find(z=>z.id==S.zone)||Z[0]; S.kills++; const df=DIFF_DATA[S.diff||1];
  const E=ex(),g=Math.round(rnd(...mob.g)*(1+E.gp/100)*df.goldM);
  S.gold+=g;addExp(Math.round(mob.x*(1+E.xp/100)*df.expM));log(`Hạ ${mob.n.replace(/<[^>]*>?/gm, '')}: +${Math.round(mob.x*df.expM)} ĐK, +${g}🪙`);
  
  if(Math.random()<(mob.boss?1:.24+E.lk/400))give(gen(z.t));
  if(z.mat&&Math.random()<.14+E.lk/400)S.mat[z.mat]=(S.mat[z.mat]||0)+1;
  
  if (Math.random() < 0.04 + E.lk/1000) {
      S.cages = (S.cages || 0) + 1;
      toast('🪤 Lồng Bắt Thú rớt ra từ quái vật!');
  }

  if(z.id=='vanthu'){
    if(Math.random()<.45)S.mat['mahach']=(S.mat['mahach']||0)+1;
    if(Math.random()<.25)S.mat['thudan']=(S.mat['thudan']||0)+1;
    if(Math.random()<.08)S.mat['tvh']=(S.mat['tvh']||0)+1;
    if(Math.random()<.15){S.cages=(S.cages||0)+1;toast('Nhặt được 1 Lồng Bắt Thú!');}
    chkSide('kill_pet',mob.id,1);
  }
  
  chkSide('kill_mob',mob.id,1);
  chkSide('kill_target',mob.id.replace('Bầy Đàn ','').replace('Cường Hóa ',''),1);
  
  const cleanMobName = mob.n.replace(/<[^>]*>?/gm, '').replace('Bầy Đàn ','').replace('Cường Hóa ','').trim();
  const q=Q[S.qi];if(S.qs=='active'&&q.goal.t=='kill'&&(q.goal.m==mob.id||cleanMobName.includes(M[q.goal.m].n))){S.pr++;chk()}
  mob=null;spawn();save();
}

function tick(){
  if(!$('ov').hidden)return;
  const s=st(),E=ex();addExp(.6*pm('exp')*(1+E.xp/100));
  for(const i in S.bf)if(--S.bf[i].t<=0)delete S.bf[i];
  for(const i in CD)if(CD[i]>0)CD[i]--;
  S.tox=Math.max(0,(S.tox||0)-.06);
  if(dead>0){if(--dead==0){php=s.h;spawn()} syncTab(); return}
  if(!mob)spawn();
  pmp=Math.min(s.m,pmp+3+E.mg);const tr=mob.tr||{};
  if(php<s.h*.35&&S.pots>0){S.pots--;php=Math.min(s.h,php+s.h*.45*pm('heal'));fx('p','+'+Math.round(s.h*.45*pm('heal')),'hl')}
  if(psn>0){psn--;const d=Math.round(s.h*.02*(1-Math.min(.8,E.kc/100)));php-=d;fx('p','☠'+d,'md')}
  if(stn>0){stn--;fx('p','💫','md')}else{
    let k=1,hits=1;
    for(const id of S.eq){
      const sk=SK[id],l=S.skl[id]||1;if(!sk||pmp<sk.mp||CD[id]>0)continue;
      pmp-=sk.mp;CD[id]=sk.cd||0;const mm=sk.m*(1+.15*(l-1)),T=sk.t;
      if(T=='h'){const h=s.h*mm;php=Math.min(s.h,php+h);fx('p','+'+Math.round(h),'hl')}
      else if(T=='sh'){sh=s.h*mm;fx('p','🛡'+Math.round(sh),'hl')}
      else{k=T=='mh'?mm/(sk.n||3)*1.2:mm;if(T=='mh')hits=sk.n||3;if(T=='dot')mob.burn={n:4,d:Math.round(s.a*.35*k)};if(T=='cc')mob.stun=2;if(T=='br')mob.brk=1}
      break;
    }
    const md0=mob.d*(tr.ar?1.5:1)*(1-Math.min(.7,E.pn/100))*(mob.brk?.6:1);
    for(let h=0;h<hits;h++){
      if(Math.random()<(tr.dg||0)/100){fx('m','Né','hl');continue}
      const cr=Math.random()<.1+E.cr/100,dm=Math.max(1,Math.round((s.a*k*(.85+Math.random()*.3)-md0)*(cr?1.5+E.cd/100:1)*(1+E.fd/100)));
      mob.hp-=dm;fx('m',(k>1?'💥':'')+dm,cr?'cr':'');
      if(cr){snd('crit');shake();}else{snd('hit');}
      if(E.ls)php=Math.min(s.h,php+dm*E.ls/100);
    }
    
    if(S.actPet){
      const p=S.pets.find(x=>x.id==S.actPet);
      if(p&&Math.random()<(p.rate/100)){
        const pDmg=Math.max(1,Math.round(p.atk*(.8+Math.random()*.4)));
        mob.hp-=pDmg;fx('m','🐾'+pDmg,'hl');
        p.exp+=2;if(p.exp>=p.maxExp&&p.lv<(5+p.q*15)){p.lv++;p.exp=0;p.maxExp=Math.round(p.maxExp*1.35);p.atk=Math.round(p.atk*1.15);p.hp=Math.round(p.hp*1.15);toast(`🐾 Ma Thú ${p.n} thăng cấp Lv.${p.lv}!`);}
      }
    }
    
    if(mob.burn&&mob.burn.n-->0){mob.hp-=mob.burn.d;fx('m','🔥'+mob.burn.d)}
  }
  if(tr.rg)mob.hp=Math.min(mob.max,mob.hp+mob.max*tr.rg/100);
  if(mob.hp<=0){kill(); syncTab(); return;}
  if(mob.stun>0){mob.stun--;fx('m','💫')}else if(Math.random()<E.ds/100)fx('p','Né!','hl');else{
    let a=mob.a;if(tr.en&&mob.hp<mob.max*.4)a*=1.4;
    const c=Math.random()<(tr.cr||0)/100;
    let md=Math.max(1,Math.round((a*(.85+Math.random()*.3)*(c?1.8:1)-s.d)*(1-Math.min(.6,E.kn/100))));
    if(sh>0){const ab=Math.min(sh,md);sh-=ab;md-=ab}
    php-=md;fx('p',(c?'⚡':'-')+md,'md');if(c)shake();
    if(tr.ps&&Math.random()<.3)psn=4;if(tr.st&&Math.random()<tr.st/100*(1-Math.min(.8,E.kc/100)))stn=1;
  }
  php=Math.min(s.h,php+s.h*E.rg/200);
  
  if(php<=0){
      php=0; dead=4; mob=null; psn=stn=sh=0;
      S.exp=Math.floor(S.exp*.85);
      if (S.gold > 1000) {
          S.gold = Math.max(1000, Math.floor(S.gold*.9));
      }
      log('💀 Bại trận! Tổn thất 15% đấu khí' + (S.gold > 1000 ? ' và 10% kim tệ' : ''));
  }
  upd();
}

function story(lines,title,cb){
  let i=0;const ov=$('ov');
  if(title&&!S.storyLog.some(x=>x.t==title)){
    S.storyLog.push({t:title,d:lines.map(l=>(l[0]?l[0]+': ':'')+l[1]).join('\n')});
  }
  const show=()=>{
    if(i>=lines.length){ov.hidden=true;cb&&cb();return}
    const[sp,tx]=lines[i++];ov.hidden=false;
    ov.innerHTML=`<div class="box" data-a="nx">${sp?'<b>'+sp+'</b>':''}<p>${tx}</p><small>Chạm bất kỳ đâu để tiếp tục ▶</small></div>`;
  };ov._n=show;show();
}

const rw=r=>`${r.gold||0}🪙 ${r.exp||0} ĐK${r.fl?' + '+P[r.fl].n:''}${r.rec?' + Đan Phương: '+(RC.find(x=>x.id==r.rec)?.n||'Đan Dược'):''}${r.item?' + Trang bị':''}`;

  story(q.outro,q.t+' (Kết)',()=>{

    if(r.fire){S.fire[r.fire]=1;const f=FR[r.fire];if(f&&f.evo)S.pq=Math.max(S.pq||0,f.evo)}

function checkAfk(){
  const now=Date.now(),diff=Math.min(now-(S.lastT||now),12*3600*1000);
  if(diff>60000){
    const mins=Math.floor(diff/60000);
    const z=Z.find(z=>z.id==S.zone)||Z[0],m=M[z.mobs[0]];
    const df=DIFF_DATA[S.diff||1];
    const expGain=Math.round(mins*m.x*1.5*pm('exp')*df.expM);
    const goldGain=Math.round(mins*m.g[1]*1.2*df.goldM);
    const herbGain=z.mat?Math.floor(mins/15):0;
    addExp(expGain);S.gold+=goldGain;
    if(herbGain&&z.mat)S.mat[z.mat]=(S.mat[z.mat]||0)+herbGain;
    let newItems=0;
    const rolls=Math.min(10,Math.floor(mins/25));
    for(let i=0;i<rolls;i++){
      const it=gen(z.t);
      if(it.set!=null||it.q>=2){
        if(!S.afkStash)S.afkStash=[];
        if(S.afkStash.length<stashC()){S.afkStash.push(it);newItems++}
      }else S.gold+=val(it);
    }
    setTimeout(()=>{
      const ov=$('ov');ov.hidden=false;
      ov.innerHTML=`<div class="box">
        <b>🧘 Bế Quan Kết Thúc!</b>
        <p>Bế quan tu luyện được: <b>${Math.floor(mins/60)} giờ ${mins%60} phút</b>.<br>
        Thu hoạch: <b>+${expGain}</b> Đấu khí, <b>+${goldGain}</b> 🪙 Kim tệ${herbGain?`, <b>+${herbGain}</b> ${MT[z.mat]?.n||'Dược Thảo'}`:''}.<br>
        ${newItems>0?`Tìm thấy <b>${newItems}</b> bảo vật quý lưu vào Rương Bế Quan!`:''}</p>
        <button class="pri" data-a="clsov">Tiếp tục tu hành</button>
      </div>`;
    },500);
  }
  S.lastT=Date.now();
}

skl(){
  return `<div class="card"><b>Đấu kỹ xuất chiến (tối đa 3)</b></div>
  ${Object.keys(S.skl).map(id=>{const k=SK[id],l=S.skl[id];return `<div class="card" data-tip="<b>${k.n}</b><br>${skTxt(k,l)}"><b class="txt-q${Math.min(5,k.g)}">${k.n}</b> <small>${QN[k.g]} giai · Lv${l}/5 · 🔷${k.mp}</small><br><small>${skTxt(k,l)}</small><br><button data-a="skeq" data-v="${id}">${S.eq.includes(id)?'Bỏ dùng ('+(S.eq.indexOf(id)+1)+')':'Dùng'}</button> ${l<5?`<button data-a="skup" data-v="${id}">Nâng cấp ${k.u*l}🪙</button>`:''}</div>`}).join('')}`;
},
alc(){
  // KHÓA TAB NẾU CHƯA CÓ PHẦN QUYẾT
  if (!S.fl.phanquyet) {
      return `<div class="card" style="text-align:center; padding: 40px 10px;">
          <span style="font-size:44px">🔥</span><br><br>
          <b style="color:var(--hp); font-size:16px;">Chưa Mở Khóa Luyện Đan</b><br><br>
          <small style="color:var(--mut)">Ngươi chưa sở hữu hỏa diễm và chưa có sư phụ chỉ dẫn.<br>Hãy tiếp tục làm Nhiệm Vụ Chính (Bí Mật Chiếc Nhẫn Đen) để thức tỉnh Dược Lão và nhận Phần Quyết!</small>
      </div>`;
  }

  const F=Object.keys(S.fire).length;
  const rk=S.al_r||0;
  const req=ALC_REQ[rk];
  const exp=S.al_e||0;
  const maxExp=req?req.exp:'Max';
  const pct=req?Math.min(100,(exp/maxExp)*100):100;
  
  let advHtml='';
  if(req){
      const okL = S.L >= req.L;
      const okC = S.al >= req.crafts;
      const okP = (S.crafted && S.crafted[req.pill] >= req.p_amt);
      const isReady = okL && okC && okP && exp >= req.exp;
      
      advHtml = `<div class="card" style="border: 2px solid var(--gd); background: rgba(180,120,24,.05)">
          <b style="color:var(--gd)">📜 Nhiệm Vụ Thăng Phẩm Luyện Dược Sư</b><br>
          <small>Điều kiện đột phá lên <b>${ALC_QN[rk+1]}</b>:</small><br>
          <small>${exp>=req.exp?'✅':'⬜'} Kinh nghiệm: ${exp}/${req.exp}</small><br>
          <small>${okL?'✅':'⬜'} Tu vi: Yêu cầu đạt ${lv(req.L)}</small><br>
          <small>${okC?'✅':'⬜'} Luyện đan thành công: ${S.al}/${req.crafts} lần</small><br>
          <small>${okP?'✅':'⬜'} Khảo nghiệm: Luyện thành công ${req.p_amt} ${RC.find(x=>x.id==req.pill)?.n} (Đã luyện: ${(S.crafted&&S.crafted[req.pill])||0})</small><br>
          <button data-a="al_up" class="${isReady?'pri':'ghost'}" ${isReady?'':'disabled'}>Đột Phá Cảnh Giới Luyện Dược Sư</button>
      </div>`;
  }

  let html = `<div class="card">
    <h3 style="margin:0 0 6px 0" class="p-txt${Math.max(0, rk-1)}">Luyện Dược Sư · ${ALC_QN[rk]}</h3>
    <small>Đan độc: ${S.tox|0}/100 · 🪙${S.gold}${F?' · 🔥 '+F+' Dị hỏa':''}</small><br>
    <div class="bar"><i style="background:var(--gd);width:${pct}%"></i></div>
    <small>Kinh nghiệm luyện dược: ${exp}/${maxExp}</small><br>
    <small style="color:#2a9d4a; font-weight:bold;">Đặc quyền: Tỷ lệ Thượng Phẩm +${rk*2}%, Tỷ lệ ra Đúp (2 viên) +${rk*1.5}%</small><br>
    <div style="margin-top:8px"><b>Dược thảo hiện có (chạm xem chi tiết):</b><br>
    ${Object.keys(MT).map(k=>`<span class="mat-tag" data-tip="${mtip(k).replace(/"/g,'&quot;')}" style="border-color:${MT[k]?(QC?.[MT[k].g]||'#ccc'):'#ccc'}">${MT[k]?MT[k].n:k} ×${S.mat[k]||0}</span>`).join(' ')}</div>
  </div>
  ${advHtml}`;

  html += RC.map(r=>{
    const unl = S.recipes[r.id];
    // LOGIC CHỐNG SOFT-LOCK: Cho phép luyện đan vượt 1 cấp so với cấp Luyện Dược Sư hiện tại
    const reqAlR = Math.max(0, r.g - 1); 
    const lockedRank = rk < reqAlR; 

    return `<div class="card" style="${unl&&!lockedRank?'':'opacity:.6'}" data-tip="${rtip(r).replace(/"/g,'&quot;')}">
      <b class="p-txt${r.g}">${r.n}</b> <small>${PL_QN[r.g]} · ${r.d}</small><br>
      <small>${Object.keys(r.need).map(k=>(MT[k]?MT[k].n:k)+' ×'+r.need[k]).join(', ')} + ${r.c}🪙 · tỉ lệ ${crate(r)}%${r.fire?' · Cần dị hỏa':''}</small><br>
      ${!unl ? '<small style="color:var(--hp)">🔒 Chưa có Đan Phương</small>' : 
        lockedRank ? `<small style="color:var(--hp)">🔒 Cảnh giới luyện dược quá thấp! Yêu cầu: ${ALC_QN[reqAlR]}</small>` : 
        `<button data-a="craft" data-v="${r.id}">Luyện đan</button>`}
      ${r.pc?`<small>Có: ${S.pl[r.id]||0} viên</small>`:[r.id,r.id+'*'].filter(i=>S.pl[i]>0).map(i=>`<button data-a="use" data-v="${i}">${i.endsWith('*')?'Thượng phẩm':'Dùng'} ×${S.pl[i]}</button>`).join(' ')}
    </div>`;
  }).join('');
  return html;
},
fire(){
  const f=P.phanquyet, ownedCount=Object.keys(S.fire||{}).length;
  const g=f&&f.st?f.st[Math.min(ownedCount,f.st.length-1)]:null;
  const hasPQ = !!(S.fl && S.fl.phanquyet);
  
  let extraHtml = '';
  if (hasPQ && g) {
      const extraStats = [];
      if (g.cr) extraStats.push(`Bạo kích +${+(g.cr).toFixed(1)}%`);
      if (g.cd) extraStats.push(`Bạo thương +${+(g.cd).toFixed(1)}%`);
      if (g.ls) extraStats.push(`Hút máu +${+(g.ls).toFixed(1)}%`);
      if (g.fd) extraStats.push(`Hỏa sát +${+(g.fd).toFixed(1)}%`);
      if (g.pn) extraStats.push(`Xuyên giáp +${+(g.pn).toFixed(1)}%`);
      if (g.kn) extraStats.push(`Kháng tính +${+(g.kn).toFixed(1)}%`);
      if (g.ds) extraStats.push(`Né tránh +${+(g.ds).toFixed(1)}%`);
      if (g.rg) extraStats.push(`Hồi phục +${+(g.rg).toFixed(1)}`);
      if (g.mg) extraStats.push(`Hồi nội lực +${+(g.mg).toFixed(1)}`);
      
      extraHtml = extraStats.length ? `<br><small style="color:var(--gd); margin-top:4px; display:inline-block">${extraStats.join(' · ')}</small>` : '';
  }

  const pqHtml = hasPQ && g ? `
    <div class="card">
      <b>📖 Phần Quyết · <span class="txt-q${Math.min(5,Math.floor(ownedCount/4)+1)}">${g.n}</span></b><br>
      <small>${g.d}</small><br>
      Đấu khí ×${g.exp} · Công ×${g.atk} · Máu ×${g.hp}
      ${extraHtml}
    </div>` : `
    <div class="card">
      <b>📖 Công pháp: Chưa có</b><br>
      <small style="color:var(--mut)">Chưa thức tỉnh Phần Quyết. Hãy hoàn thành nhiệm vụ "Bí Mật Chiếc Nhẫn Đen".</small>
    </div>`;

  const listHtml = G.ALL_FIRES.map(d=>{
    const isOwned=!!(S.fire && S.fire[d.id]);
    let ft = 1;
    if (d.rk === 1) ft = 7;
    else if (d.rk <= 3) ft = 6;
    else if (d.rk <= 8) ft = 5;
    else if (d.rk <= 13) ft = 4;
    else if (d.rk <= 17) ft = 3;
    else if (d.rk <= 20) ft = 2;

    if (ft === 7) {
        return `<div class="de-viem-card" style="${isOwned?'':'opacity:.65; filter:grayscale(0.8)'}">
            <div class="de-viem-content">
                <div class="sl">
                    <b>🔥 Hạng 1: <span class="f-txt7">${d.n}</span></b>
                    <span style="font-weight:700;color:${isOwned?'#2a9d4a':'var(--mut)'}">${isOwned?'Đã thu phục':'Chưa thu phục'}</span>
                </div>
                <small>${d.d}</small><br>
                ${Object.keys(d.b||{}).map(k=>`<span data-tip="${STT[k][2]}">${STT[k][0]} ${STT[k][1]} +${d.b[k]}${STT[k][3]}</span>`).join(' · ')}
            </div>
        </div>`;
    }

    return `<div class="card f-t${ft}" style="${isOwned?'':'opacity:.65'}">
      <div class="sl">
        <b>🔥 Hạng ${d.rk}: <span class="f-txt${ft}">${d.n}</span></b>
        <span style="font-weight:700;color:${isOwned?'#2a9d4a':'var(--mut)'}">${isOwned?'Đã thu phục':'Chưa thu phục'}</span>
      </div>
      <small>${d.d}</small><br>
      ${Object.keys(d.b||{}).map(k=>`<span data-tip="${STT[k][2]}">${STT[k][0]} ${STT[k][1]} +${d.b[k]}${STT[k][3]}</span>`).join(' · ')}
    </div>`;
  }).join('');

  return pqHtml + `
    <div class="card">
      <b>🔥 Dị Hỏa Bảng Đại Lục (Đã thu phục ${ownedCount}/23)</b><br>
      <small>Thu phục Dị Hỏa giúp Phần Quyết tiến hóa, tăng vọt Đấu khí và Chiến lực.</small>
    </div>` + listHtml;
},
pet(){
  const act=S.pets.find(x=>x.id==S.actPet);
  return `<div class="card">
    <b>🐾 Hệ Thống Ma Thú &amp; Tiến Giai</b><br>
    <small>Ma Thú xuất chiến trợ công uy lực. Thú xuất chiến sẽ kích động quái vật, tăng tỷ lệ gặp quái "Cường Hóa" hoặc "Bầy Đàn" để farm nhiều tài nguyên hơn!</small>
    <div class="sl"><span>Lồng Bắt Thú: <b>${S.cages||0}</b></span><button data-a="zone" data-v="vanthu">Tới Vạn Thú Cốc</button></div>
    <div class="sl"><span>Ma Hạch: <b>${S.mat['mahach']||0}</b></span><span>Thú Linh Đan: <b>${S.mat['thudan']||0}</b></span><span>Thú Vương Huyết: <b>${S.mat['tvh']||0}</b></span></div>
  </div>
  ${act?`<div class="card" style="border:2px solid var(--gd)">
    <b>Đang xuất chiến: <span class="${act.q>=6?'rb-txt':'txt-q'+Math.min(5,act.q)}">🐾 ${act.n}</span></b> <small>[${QN[act.q]} Giai · Lv.${act.lv}]</small><br>
    ⚔️ Công trợ chiến: <b>+${act.atk}</b> · ❤️ Sinh lực: <b>+${act.hp}</b> · Trợ công: <b>${act.rate}%</b><br>
    <div class="bar"><i style="background:var(--xp);width:${(act.exp/act.maxExp)*100}%"></i></div>
    <small>Kinh nghiệm: ${act.exp}/${act.maxExp}</small><br>
    <button data-a="feedpet" data-v="${act.id}">Cho ăn Ma Hạch (+50 EXP)</button>
    <button data-a="unpet">Thu hồi</button>
  </div>`:'' }
  <div class="card">
    <b>Danh Sách Ma Thú Đã Thu Phục (${S.pets.length})</b>
    ${S.pets.length?S.pets.map(p=>`<div class="sl">
      <span><span class="${p.q>=6?'rb-txt':'txt-q'+Math.min(5,p.q)}">🐾 <b>${p.n}</b></span><br><small>[${QN[p.q]} Giai] Lv.${p.lv}</small></span>
      <div style="text-align:right">
        <button data-a="callpet" data-v="${p.id}">${S.actPet==p.id?'Đang chiến':'Xuất chiến'}</button><br>
        <button data-a="evopet" data-v="${p.id}" style="margin-top:4px">Tiến Giai</button>
      </div>
    </div>`).join(''):'<br><small>Chưa bắt được Ma Thú nào. Hãy đến Vạn Thú Cốc dùng Lồng Bắt Thú để săn!</small>'}
  </div>`;
},
quest(){
  const q=Q[S.qi],g=q&&q.goal,p=q?g.t=='craft'?`Luyện ${Math.min(S.pr,g.n)}/${g.n} viên đan`:g.t=='kill'?`Hạ ${Math.min(S.pr,g.n)}/${g.n} ${M[g.m].n}`:`Đạt ${lv(g.v)} (hiện tại: ${lv(S.L)})`:'';
  const cur=q?`<div class="card"><small>${q.ch}</small><h3 style="margin:4px 0">${q.t}</h3><p>${q.d}</p><p>🎯 ${S.qs=='new'?'Chưa nhận':p}</p>${S.qs=='ready'?'<button class="pri" data-a="claim">Hoàn thành &amp; Nhận thưởng</button>':''}<small>Thưởng: ${rw(q.rw)}</small></div>`:`<div class="card"><b>${G.end}</b></div>`;
  
  const chProgress=G.ch.map(c=>{
    const cQuests=Q.filter(x=>x.cid==c.id);
    const cDone=cQuests.filter(x=>S.done[x.id]).length;
    return `<div class="card">
      <b>${c.name}</b>: <b>${cDone}/${cQuests.length}</b> nhiệm vụ
      <div style="font-size:12px;margin-top:4px">${cQuests.map(x=>`<div class="sl"><span>${S.done[x.id]?'✅':'⬜'} ${x.t}</span><small>${S.done[x.id]?'Đã xong':(q&&q.id==x.id?'Đang làm':'Chưa tới')}</small></div>`).join('')}</div>
    </div>`;
  }).join('');

  const actPts = S.actPoint || 0;
  const listDaily = S.dailyQuests || [];
  const sideHtml = `<div class="card">
    <div class="sl">
      <b>🎯 Nhiệm Vụ Hằng Ngày &amp; Năng Động</b>
      <button data-a="ref_daily">Đổi mới (500🪙)</button>
    </div>
    <div style="margin:6px 0">
      <small>Độ năng động hôm nay: <b>${actPts}/100</b></small>
      <div class="bar"><i style="background:var(--xp);width:${actPts}%"></i></div>
      ${actPts>=100&&!S.actClaimed?`<button class="pri" data-a="claim_act">Nhận Rương Năng Động (5000🪙 + 2 Lồng + 5 Ma Hạch)</button>`:actPts>=100?'<small style="color:#2a9d4a">Đã nhận rương thưởng hôm nay</small>':''}
    </div>
    ${listDaily.map(sq=>{
      const isDone = S.sideDone && S.sideDone[sq.id];
      const curPr = Math.min(sq.n, (S.sidePr && S.sidePr[sq.id]) || 0);
      const r = sq.rw || {};
      const rBonus = r.mat ? ` · 🌿 ${r.mat.n} ×${r.mat.c}` : r.pill ? ` · 🧪 ${r.pill.n} ×${r.pill.c}` : r.cages ? ` · 🪤 Lồng ×${r.cages}` : r.mahach ? ` · 💎 Ma Hạch ×${r.mahach}` : '';
      return `<div class="sl">
        <div>
          <b>${sq.name}</b><br>
          <small>${sq.desc} (${curPr}/${sq.n})</small><br>
          <small style="color:var(--gd)">Thưởng: 🪙${r.gold||0}${rBonus}</small>
        </div>
        <div>${isDone?'<span style="color:#2a9d4a;font-weight:700">Đã xong</span>':`<small>+25 NĐ</small>`}</div>
      </div>`;
    }).join('')}
  </div>`;

  return cur+chProgress+sideHtml;
},
story(){
  return `<div class="card"><b>📚 Tàng Thư Các · Biên Niên Sử Đấu Phá</b><br><small>Kể lại chi tiết toàn bộ cốt truyện và các mốc nhiệm vụ để bạn nắm vững nguyên tác.</small></div>
  <div class="card">
    <h3 style="margin:4px 0;color:var(--gd)">Chương 1: Ô Thản Thành &amp; Ma Thú Sơn Mạch</h3>
    <p style="font-size:12.5px;line-height:1.6">
    <b>1. Đấu Chi Khí Tam Đoạn:</b> Tiêu Viêm từng là thiên tài 11 tuổi thành Đấu Giả, đột nhiên đấu khí biến mất suốt 3 năm, rớt về Tam Đoạn, chịu đủ lời cười chê khinh bỉ của tộc nhân Tiêu gia.<br>
    <b>2. Dược Lão Thức Tỉnh:</b> Bí mật chiếc nhẫn đen của người mẹ quá cố được hé lộ: hồn thể của Dược Trần (Dược Tôn Giả - Đệ nhất Luyện dược sư đại lục) hút đấu khí để hồi sinh, sau đó nhận Tiêu Viêm làm đồ đệ và truyền thụ công pháp thôn phệ dị hỏa thần bí <i>Phần Quyết</i>.<br>
    <b>3. Trúc Cơ &amp; Đấu Giá Hội:</b> Dược Lão chế ra Trúc Cơ Linh Dịch cho Tiêu Viêm tẩy tủy. Hắn khoác áo hắc bào đến Đấu giá hội Mễ Đặc Nhĩ, gặp gỡ mỹ nữ Nhã Phi để đấu giá linh dịch kiếm tiền mua dược liệu.<br>
    <b>4. Nạp Lan Yên Nhiên Thối Hôn:</b> Nạp Lan Yên Nhiên cậy thế đại phái Vân Lam Tông đến cửa hủy hôn. Tiêu Viêm phẫn nộ viết hưu thư, thốt lên câu danh ngôn: <i>"Ba mươi năm Hà Đông, ba mươi năm Hà Tây, đừng khinh thiếu niên nghèo!"</i> và hẹn ước quyết đấu sau ba năm.<br>
    <b>5. Tộc Thí Đài:</b> Tiêu Viêm khổ luyện trở lại cảnh giới Đấu Giả, dùng một quyền đánh bại thiên tài Tiêu Ninh trước sự kinh ngạc của toàn tộc.<br>
    <b>6. Ma Thú Sơn Mạch &amp; Tiểu Y Tiên:</b> Tiêu Viêm vào rừng sâu sinh tử tu luyện, kết giao cùng nữ y sĩ Ách Nan Độc Thể Tiểu Y Tiên, tìm thấy Tử Vân Dực và bảo tàng trong vách núi, sau đó một mình đồ sát toàn bộ Lang Đầu Binh Đoàn.<br>
    <b>7. Bát Cực Băng &amp; Thú Vương:</b> Lĩnh ngộ cận chiến đấu kỹ Bát Cực Băng với 8 tầng ám kình, chém giết Hắc Giáp Thú Vương, kết thúc hành trình rèn luyện đầu đời.
    </p>
  </div>
  <div class="card">
    <h3 style="margin:4px 0;color:var(--gd)">Chương 2: Sa Mạc Tháp Qua Nhĩ &amp; Đại Chiến Vân Lam</h3>
    <p style="font-size:12.5px;line-height:1.6">
    <b>1. Băng Hoàng Hải Ba Đông:</b> Đến Gia Mã Đế Đô, Tiêu Viêm tìm được tàn đồ Dị Hỏa tại sa mạc và kết giao Băng Hoàng Hải Ba Đông đang bị phong ấn tu vi.<br>
    <b>2. Huyết Tẩy Mặc Gia Phủ:</b> Vì cứu cô bé xà nhân Thanh Lân bị bắt cóc mổ mắt đoạt Bích Xà Tam Hoa Đồng, Tiêu Viêm nộ hỏa xung thiên đánh sập phủ đệ Mặc gia, tiêu diệt Mặc Thừa.<br>
    <b>3. Đoạt Thanh Liên Địa Tâm Hỏa:</b> Xuống lòng đất dung nham sa mạc, chứng kiến Nữ vương Mỹ Đỗ Toa dùng Dị Hỏa tiến hóa thành Thất Thải Thôn Thiên Mãng, Tiêu Viêm ngậm Băng Linh Hàn Tuyền, cắn răng nuốt ngọn Dị Hỏa đầu tiên vào cơ thể, tiến hóa Phần Quyết lên Huyền giai.<br>
    <b>4. Quán Quân Luyện Dược Hội:</b> Cải danh Nham Kiêu, dùng Dị Hỏa luyện ra Tam Văn Thanh Linh Đan đoạt ngôi đầu Đại hội Luyện Dược Sư, đồng thời dùng lửa khử sạch Lạc Độc cứu sống Nạp Lan Kiệt.<br>
    <b>5. Ba Năm Chi Ước Huyết Chiến:</b> Đúng hẹn, Tiêu Viêm vác Huyền Trọng Xích bước lên đỉnh Vân Lam Sơn Môn, dùng Phật Nộ Hỏa Liên đánh bại Nạp Lan Yên Nhiên trước sự chứng kiến của toàn thể cường giả đế quốc.<br>
    <b>6. Vân Sơn Tông Chủ Truy Sát:</b> Đại Trưởng Lão Vân Lăng nhục nhã kết trận vây bắt, Tông chủ Đấu Tông Vân Sơn xuất quan. Dược Lão hao tổn linh hồn phá vây, Tiêu Viêm đào tẩu sang Hắc Giác Vực.
    </p>
  </div>
  <div class="card">
    <h3 style="margin:4px 0;color:var(--gd)">Chương 3: Già Nam Học Viện &amp; Vẫn Lạc Tâm Viêm</h3>
    <p style="font-size:12.5px;line-height:1.6">
    <b>1. Hắc Ấn Đấu Giá &amp; Tân Sinh:</b> Tiến vào vùng đất hỗn loạn Hắc Giác Vực, đoạt được thân pháp Địa giai Tam Thiên Lôi Động, dẫn đầu tân sinh bước vào Già Nam Học Viện.<br>
    <b>2. Hỏa Năng Liệp Tái &amp; Bàn Môn:</b> Đánh bại hai đại đội Lão sinh Hắc Bạch Song Sát (Sa Thiết và La Hầu), cướp sạch thẻ Hỏa Năng. Cùng Huân Nhi, Hổ Gia, Ngô Hạo sáng lập thế lực Bàn Môn vững chắc.<br>
    <b>3. Thiên Phần Luyện Khí Tháp:</b> Xuống tháp rèn luyện mượn lực tâm hỏa, Tiêu Viêm đột phá Đấu Vương (Hóa Dực), thượng đài Cường Giả Bảng đánh bại Bạch Trình và Liễu Kình.<br>
    <b>4. Man Lực Vương Tử Nghiên:</b> Đệ Nhất Cường Giả Bảng là cô bé Thái Hư Cổ Long ham ăn đan dược, Tiêu Viêm dùng đan dược thu phục làm muội muội và được dẫn đi tìm ngọc dịch Địa Tâm Nhũ.<br>
    <b>5. Hắc Minh Tập Kích &amp; Dị Hỏa Bạo Động:</b> Nghịch đồ Hàn Phong cùng Kim Ngân Song Lão tấn công cướp Dị Hỏa. Vẫn Lạc Tâm Viêm phá vỡ phong ấn hóa hình Hỏa Mãng khổng lồ, nuốt Tiêu Viêm xuống đáy nham thạch vạn trượng.<br>
    <b>6. Dưới Đáy Nham Thạch Vạn Trượng:</b> Bị nhốt cùng Thải Lân (Mỹ Đỗ Toa), Dược Lão ngủ say, Tiêu Viêm liều chết thuần phục Vẫn Lạc Tâm Viêm, hóa giải ân oán cùng Thải Lân, Phần Quyết tiến hóa Địa giai cao cấp, phá cảnh Đấu Hoàng!<br>
    <b>7. Diệt Sát Hàn Phong:</b> Trở lại nhân gian, tung Song Hỏa Phật Nộ Hỏa Liên tiêu diệt nghịch đồ Hàn Phong, đoạt lại Hải Tâm Diễm, hiệu triệu Tiêu Môn sẵn sàng trở về Gia Mã Đế Quốc rửa hận!
    </p>
  </div>
  <div class="card">
    <b>Hồi Ức Đã Ghi Lại Trong Trận (${S.storyLog.length})</b>
    ${S.storyLog.length ? S.storyLog.map((s, idx) => ({s, idx})).reverse().map(({s, idx}) => `
      <div class="sl">
        <span><b>📜 ${s.t}</b></span>
        <button type="button" data-a="view_story" data-v="${idx}">Xem lại</button>
      </div>`).join('') : '<br><small>Chưa có đối thoại nào được lưu lại.</small>'}
  </div>`;
},

function draw(){
  $('main').innerHTML=T[tab]();
  document.querySelectorAll('nav.bot-nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));
  upd();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  $('tp').hidden = true;
  const a=b.dataset.a,v=b.dataset.v;
  if(a=='nx')return $('ov')._n();
  if(a=='clsov')return $('ov').hidden=true;
  if(a=='tab'){tab=v; draw();}
  else if(a=='view_story'){
    const item = S.storyLog[+v];
    if(item){
      const ov=$('ov'); ov.hidden=false;
      ov.innerHTML=`<div class="box">
        <b>📜 ${item.t}</b>
        <div style="font-size:13px;line-height:1.6;white-space:pre-line;max-height:60vh;overflow-y:auto;margin:10px 0;padding-right:4px;color:var(--ink)">${item.d}</div>
        <button class="pri" data-a="clsov">Đóng</button>
      </div>`;
    }
  }
  else if(a=='tgsnd'){S.snd=S.snd?0:1;toast(S.snd?'Đã bật âm thanh':'Đã tắt âm thanh');draw()}
  else if(a=='setcur'){setCursor(v);draw()}
  else if(a=='setdiff'){S.diff=+v;mob=null;spawn();toast('Đã chuyển độ khó: '+DIFF_DATA[S.diff].n);draw()}
  else if(a=='zone'){S.zone=v;mob=null;spawn(); tab='fight'; draw();}
  else if(a=='claim')return claim();
  else if(a=='skeq'){const i=S.eq.indexOf(v);if(i>=0)S.eq.splice(i,1);else if(S.eq.length<3)S.eq.push(v);else toast('Chỉ mang tối đa 3 đấu kỹ')}
  else if(a=='skup'){const c=SK[v].u*S.skl[v];if(S.gold>=c){S.gold-=c;S.skl[v]++;snd('up');syncTab();}else toast('Không đủ kim tệ')}
  else if(a=='bt'){bt();return}
  else if(a=='bag'){
    const c=500*((S.bg||0)+1)**2;
    if(S.gold>=c&&(S.bg||0)<20){S.gold-=c;S.bg=(S.bg||0)+1;toast('Nạp Giới mở rộng thêm 10 ô!');chkSide('up_bag',1,1);syncTab();}
    else toast('Không đủ kim tệ hoặc đã đạt mốc tối đa');
  }
  else if(a=='up_stash'){
    const c=500*((S.sbg||0)+1)**2;
    if(S.gold>=c&&(S.sbg||0)<20){S.gold-=c;S.sbg=(S.sbg||0)+1;toast('Rương Bế Quan mở rộng thêm 10 ô!');$('ov').hidden=true;syncTab();}
    else toast('Không đủ kim tệ hoặc đã đạt tối đa');
  }
  else if(a=='catch_pet'){
    if(!mob || S.zone !== 'vanthu') return;
    if((S.cages||0) <= 0) return toast('Đã hết Lồng Bắt Thú! Hãy đánh quái để nhặt thêm.');
    S.cages--;
    const hpPct = mob.hp / mob.max;
    const rate = 25 + (hpPct < 0.3 ? 20 : hpPct < 0.6 ? 10 : 0);
    if(Math.random() * 100 < rate){
      const petQuality = (mob.id=='vt_long'?5 : mob.id=='vt_su'?4 : mob.id=='vt_lang'?3 : mob.id=='vt_ngac'?2 : 1);
      const petObj = {
        id: S.uid++,
        n: mob.n.replace(/<[^>]*>?/gm, '').replace(' (Ấu)','').replace(' (Ấu Thú)','').replace('Bầy Đàn ','').replace('Cường Hóa ','').trim(),
        q: petQuality,
        lv: 1,
        exp: 0,
        maxExp: 100,
        atk: Math.round(mob.a * 0.5),
        hp: Math.round(mob.hp * 0.35),
        rate: 30
      };
      if(!S.pets) S.pets = [];
      S.pets.push(petObj);
      if(!S.actPet) S.actPet = petObj.id;
      toast(`🎉 Bắt thành công Ma Thú: ${petObj.n}!`);
      snd('up');
      mob = null;
      spawn();
    } else {
      toast('Bắt thất bại! Ma Thú đã giãy giụa thoát khỏi lồng.');
    }
    syncTab();
  }
  else if(a=='evopet'){
    const p = S.pets.find(x=>x.id==+v);
    if(!p) return;
    if(p.q >= 6) return toast('Ma thú đã đạt cảnh giới cao nhất (Thần Giai)!');
    const reqLv = 5 + p.q * 5;
    if(p.lv < reqLv) return toast(`Cần đạt Lv.${reqLv} để tiến giai!`);
    const costTgd = 1, costTvh = p.q;
    if((S.pl['tgd']||0) < costTgd || (S.mat['tvh']||0) < costTvh) {
        return toast(`Thiếu nguyên liệu! Yêu cầu: ${costTgd} Tiến Giai Đan, ${costTvh} Thú Vương Huyết.`);
    }
    const rate = Math.max(10, 100 - p.q * 15);
    const nxtQ = p.q + 1;
    const cls = nxtQ >= 6 ? 'rb-txt' : 'txt-q' + Math.min(5, nxtQ);
    const ov = $('ov'); ov.hidden = false;
    ov.innerHTML = `<div class="box">
        <b>🔥 Tiến Giai Ma Thú: <span class="${cls}">${p.n}</span></b>
        <p>Tiến giai lên <b>${QN[nxtQ]} Giai</b>. Tỷ lệ thành công: <b>${rate}%</b>.</p>
        <p>Tiêu hao: <b>${costTgd}</b> Tiến Giai Đan, <b>${costTvh}</b> Thú Vương Huyết.</p>
        <small style="color:var(--mut)">Thất bại sẽ mất nguyên liệu, ma thú không bị giáng cấp.</small>
        <div style="margin-top:12px; display:flex; gap:6px;">
            <button class="pri" data-a="do_evo" data-v="${p.id}">Tiến Hành Khai Mở Huyết Mạch</button>
            <button data-a="clsov">Hủy Bỏ</button>
        </div>
    </div>`;
  }
  else if(a=='do_evo'){
    const p = S.pets.find(x=>x.id==+v);
    $('ov').hidden = true;
    if(!p) return;
    const costTgd = 1, costTvh = p.q;
    if((S.pl['tgd']||0) < costTgd || (S.mat['tvh']||0) < costTvh) return toast('Không đủ nguyên liệu!');
    S.pl['tgd'] -= costTgd; S.mat['tvh'] -= costTvh;
    const rate = Math.max(10, 100 - p.q * 15);
    if(Math.random() * 100 < rate) {
        p.q++;
        p.atk = Math.round(p.atk * 1.8);
        p.hp = Math.round(p.hp * 1.8);
        p.rate = Math.min(80, p.rate + 5);
        toast(`🎉 Chúc mừng! Ma thú ${p.n} đã đột phá lên ${QN[p.q]} Giai!`);
        snd('up');
        if (p.q === 6) flash();
    } else {
        toast('Tiến giai thất bại! Nguyên liệu đã hóa thành tro bụi.');
    }
    syncTab();
  }
  else if(a=='craft'){
    const r=RC.find(x=>x.id==v), F=Object.keys(S.fire).length;
    const alRnk = S.al_r || 0;
    const reqAlR = Math.max(0, r.g - 1); // Logic cho phép vượt 1 cấp

    if(!S.recipes[r.id]) toast('Chưa có Đan Phương, không thể luyện!');
    else if(r.fire && !F) toast('Cần sở hữu Dị Hỏa mới có thể luyện đan này');
    else if(alRnk < reqAlR) toast(`Cảnh giới Luyện Dược Sư quá thấp! Yêu cầu tối thiểu ${ALC_QN[reqAlR]}.`);
    else if(S.gold<r.c || Object.keys(r.need).some(k=>(S.mat[k]||0)<r.need[k])) toast('Thiếu dược liệu hoặc kim tệ');
    else {
      S.gold-=r.c; for(const k in r.need) S.mat[k]-=r.need[k];
      
      if(Math.random()*100 < crate(r)) {
        S.al++;
        if(!S.crafted) S.crafted = {};
        S.crafted[r.id] = (S.crafted[r.id] || 0) + 1; // Lưu tiến trình đan chỉ định
        
        // Cộng EXP Luyện Dược Sư
        const maxExp = ALC_REQ[alRnk] ? ALC_REQ[alRnk].exp : Infinity;
        S.al_e = Math.min(maxExp, (S.al_e || 0) + ALC_EXP[r.g]);

        chkSide('craft_pill', r.id, 1); 
        chkSide('craft_any', null, 1);  
        
        // Đặc quyền Cấp Bậc: Tỷ lệ x2 Đan
        const doubleChance = alRnk * 1.5;
        const isDouble = Math.random() * 100 < doubleChance;
        const amt = isDouble ? 2 : 1;

        // Đặc quyền Cấp Bậc: Tỷ lệ Thượng Phẩm
        const fineChance = 12 + S.al*0.004 + ex().lk/400 + (alRnk*2);
        const fine = r.fx && Math.random()*100 < fineChance;
        const id = r.id + (fine ? '*' : '');
        
        S.pl[id] = (S.pl[id] || 0) + amt;
        
        if (r.g >= 4) {
            epicCraftFx(r.g, r.n, fine);
        } else {
            toast(`Luyện thành công ${isDouble?'x2':''} ${r.n}${fine?' (Thượng phẩm!)':''}`);
            snd('craft');
        }

        const q=Q[S.qi];
        if (S.qs=='active' && q.goal.t=='craft' && (!q.goal.m || q.goal.m == r.id)) {
            S.pr += amt; chk();
        }
      } else toast('Luyện đan thất bại! Đan dược hóa tro tàn');
      syncTab();
    }
  }
  else if(a=='al_up'){
    const rk = S.al_r || 0;
    const req = ALC_REQ[rk];
    if (req) {
        const okL = S.L >= req.L;
        const okC = S.al >= req.crafts;
        const okP = (S.crafted && S.crafted[req.pill] >= req.p_amt);
        const exp = S.al_e || 0;
        
        if (okL && okC && okP && exp >= req.exp) {
            S.al_r = rk + 1;
            S.al_e = 0; // Đặt lại EXP cho cấp mới
            toast(`🎉 Khai mở huyết mạch! Thăng cấp Luyện Dược Sư ${ALC_QN[S.al_r]}!`);
            snd('up');
            flash();
            syncTab();
        }
    }
  }
  else if(a=='use'){
    const fine=v.endsWith('*'),r=RC.find(x=>x.id==v.replace('*','')),m=fine?1.3:1;
    if(S.pl[v]>0&&r.fx){
      S.pl[v]--;
      if(r.fx=='cl'){S.tox=0;toast('Đã thanh lọc toàn bộ đan độc!')}
      else{
        S.tox=Math.min(100,(S.tox||0)+(r.tx||0));
        if(r.fx=='hp')php=Math.min(st().h,php+st().h*r.v*m/100);
        else{
          const b=S.bf[r.fx],k=r.stk||1;
          if(b&&b.id==r.id){if(b.n<k){b.n++;b.v=r.v*m*b.n}b.t=r.dur}
          else S.bf[r.fx]={id:r.id,v:r.v*m,t:r.dur,n:1};
        }
      }
      syncTab();
    }
  }
  else if(a=='buy'){if(S.gold>=30){S.gold-=30;S.pots++;snd('drop');syncTab();}else toast('Không đủ kim tệ')}
  else if(a=='eq'){
    const i=S.inv.findIndex(x=>x.id==v);if(i<0)return;
    const it=S.inv[i];
    const ov=$('ov');ov.hidden=false;
    ov.innerHTML=`<div class="box">
      <div>${itip(it)}</div>
      <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
        <button class="pri" data-a="wearit" data-v="${it.id}">Mặc vào</button>
        <button data-a="lockit" data-v="${it.id}">${it.lock?'Mở Khóa 🔓':'Khóa 🔒'}</button>
        <button data-a="sellone" data-v="${it.id}" style="color:var(--hp)">Bán (${val(it)}🪙)</button>
        <button data-a="clsov">Đóng</button>
      </div>
    </div>`;
    return;
  }
  else if(a=='auto_eq'){
    let changed = false;
    let tempInv = [...S.inv];
    for(let slot of SLS.split('')) {
        let currentEq = S.gear[slot];
        let bestScore = currentEq ? sc(currentEq) : -1;
        let bestIndex = -1;
        for(let i=0; i<tempInv.length; i++) {
            let it = tempInv[i];
            if(it.s === slot && !it.lock) {
                let itScore = sc(it);
                if(itScore > bestScore) {
                    bestScore = itScore;
                    bestIndex = i;
                }
            }
        }
        if(bestIndex !== -1) {
            let newEq = tempInv.splice(bestIndex, 1)[0];
            if(currentEq) tempInv.push(currentEq); 
            S.gear[slot] = newEq;
            changed = true;
        }
    }
    if(changed) {
        S.inv = tempInv;
        toast('Đã tự động thay trang bị tốt nhất!');
        snd('drop');
        syncTab();
    } else {
        toast('Không có trang bị nào mạnh hơn trong Nạp Giới.');
    }
  }
  else if(a=='wearit'){
    const i=S.inv.findIndex(x=>x.id==v);
    if(i>=0){
      const it=S.inv[i],cu=S.gear[it.s];
      S.inv.splice(i,1);if(cu)S.inv.push(cu);S.gear[it.s]=it;snd('drop');
    }
    $('ov').hidden=true; syncTab();
  }
  else if(a=='lockit'){
    const it=S.inv.find(x=>x.id==v)||Object.values(S.gear).find(x=>x&&x.id==v)||(S.afkStash||[]).find(x=>x.id==v);
    if(it){it.lock=it.lock?0:1;toast(it.lock?'Đã khóa trang bị 🔒':'Đã mở khóa 🔓');syncTab();}
    $('ov').hidden=true;
  }
  else if(a=='sellone'){
    const i=S.inv.findIndex(x=>x.id==v);
    if(i>=0){
      const it=S.inv[i];if(it.lock)return toast('Trang bị đang khóa!');
      S.inv.splice(i,1);S.gold+=val(it);snd('drop');
    }
    $('ov').hidden=true; syncTab();
  }
  else if(a=='enh'){

// Tooltip (Hover) bám chuột
const TP=()=>$('tp');
document.addEventListener('mousemove', e => {
  const tp = TP();
  // KHẮC PHỤC CHỒNG CHÉO: Nếu Pop-up/Overlay đang mở, cấm hiển thị Tooltip
  if (!$('ov').hidden) {
    tp.hidden = true;
    return;
  }

  const t = e.target.closest('[data-tip]');
  const btn = e.target.closest('button');

  // Khử nhiễu: Nếu trỏ vào vùng nút không có tooltip, thì tắt
  if (t && (!btn || btn === t)) {
    if (tp.innerHTML !== t.dataset.tip) tp.innerHTML = t.dataset.tip;
    tp.hidden = false;
    
    let x = e.clientX + 15;
    let y = e.clientY + 15;
    
    // Thuật toán giữ Tooltip luôn nằm gọn trong màn hình Mobile
    if (x + tp.offsetWidth > window.innerWidth) x = window.innerWidth - tp.offsetWidth - 10;
    if (x < 10) x = 10; // Chặn lấn mép trái
    
    if (y + tp.offsetHeight > window.innerHeight) y = e.clientY - tp.offsetHeight - 15; // Nếu lấn mép dưới, dời lên trên ngón tay
    if (y < 10) y = 10; // Chặn lấn mép trên
    
    tp.style.left = x + 'px';
    tp.style.top = y + 'px';
  } else {
    tp.hidden = true;
  }
});

  RC=G.ch.flatMap(c=>c.recipes||[]);
  MT=Object.assign({},...G.ch.map(c=>c.mats||{}));
  M={};G.ch.forEach(c=>(c.mobs||[]).forEach(m=>M[m.id]=m));
  P=Object.assign({},...G.ch.map(c=>c.perks||{}));
  try{S=Object.assign(newS(),JSON.parse(localStorage.getItem(SAVE)))}catch(e){S=newS()}
  if(!S.recipes)S.recipes={hq:1,tkt:1,tcl:1};

  setCursor(S.cursor);

  php=st().h;pmp=st().m;spawn();draw();begin();checkAfk();

};

q('c2q4','Điều Tra Mặc Gia','Hạ 20 Mặc Gia Thiết Vệ bảo hộ phủ đệ.',{t:'kill',m:'hove',n:20},'Mặc gia mưu đồ bắt cóc Thanh Lân hòng chiếm đoạt Bích Xà Tam Hoa Đồng. Tiêu Viêm lập tức xuất thủ!','Mặc Thừa dùng bí thuật cấy ghép dị đồng, cục diện căng thẳng.',{gold:2200,exp:X(20),rec:'hld',pots:6}),
q('c2q5','Huyết Tẩy Mặc Gia Phủ','Tiêu diệt 15 Khôi Lỗi Cơ Quan Mặc Gia san bằng phủ đệ.',{t:'kill',m:'kh',n:15},'Tiêu Viêm nộ hỏa xung thiên, vung Huyền Trọng Xích nghiền nát cơ quan khôi lỗi!','Mặc Gia bị quét sạch, giải cứu thành công Thanh Lân.',{gold:2400,exp:X(20),pots:5}),
q('c2q6','Sa Mạc Tháp Qua Nhĩ','Đạt Đấu Sư 4 tinh (cấp 21) để chống chọi cái nóng sa mạc.',{t:'lv',v:21},'Bão cát ngút trời, sa mạc Tháp Qua Nhĩ nóng như thiêu như đốt. Dị Hỏa đang ẩn giấu dưới đáy cát sâu!','Thân thể chịu nhiệt bền bỉ, đã đủ sức tiến sâu vào lòng đất.',{gold:2800,exp:X(21),rec:'blh',pots:6}),
q('c2q7','Tiến Vào Hồ Địa Hỏa','Hạ 25 Hỏa Diễm Mãng Xà dưới lòng hồ dung nham.',{t:'kill',m:'hxa',n:25},'Dưới lòng sa mạc là một biển dung nham sôi sùng sục. Bầy rắn lửa canh giữ dị bảo ngàn năm.','Dung nham rẽ lối, khí tức Dị Hỏa ngày càng cận kề.',{gold:3200,exp:X(23),item:{s:'a',t:6,q:2}}),
q('c2q8','Địa Hỏa Song Đầu Thú','Tiêu diệt Địa Hỏa Song Đầu Thú bảo vệ tâm hồ.',{t:'kill',m:'hthu',n:20},'Ma thú hai đầu khổng lồ vùng vẫy trong biển lửa phun ra từng cột nham thạch nóng bỏng.','Địa thú gục ngã, lộ ra đóa hoa sen xanh ngát giữa lòng hồ!',{gold:3500,exp:X(24),rec:'pgd',pots:6}),
q('c2q9','Thôn Phệ Thanh Liên Dị Hỏa','Đánh bại Thanh Liên Hỏa Linh, thu phục Dị Hỏa (Boss).',{t:'kill',m:'tlh',n:1},'Đóa sen xanh ngát nở rộ: Thanh Liên Địa Tâm Hỏa! Tiêu Viêm nuốt Băng Linh Hàn Tuyền, cắn răng nuốt ngọn lửa xanh vào đan điền!','Hỏa diễm dung hòa vào kinh mạch. Phần Quyết tiến hóa thành công lên Huyền giai!',{gold:7000,exp:X(25),fire:'tl',sk:'hlt',rec:'tld',item:{s:'c',t:6,q:3}}),
q('c2q10','Thôn Thiên Mãng Xuất Thế','Đạt Đấu Sư 7 tinh (cấp 24) kết giao Thất Thải Thôn Thiên Mãng.',{t:'lv',v:24},'Sau khi tiến hóa Dị Hỏa thất bại, linh hồn Mỹ Đỗ Toa hóa thành tiểu xà Thất Thải Thôn Thiên Mãng quấn quanh cổ tay Tiêu Viêm.','Có thêm một trợ thủ cấp Đấu Tông tiềm năng bảo hộ!',{gold:3500,exp:X(24),pots:6}),
q('c2q11','Luyện Dược Sư Đại Hội','Luyện thành 2 viên Tam Văn Thanh Linh Đan chấn động kinh thành.',{t:'craft',m:'tvt',n:2},'Đại hội Luyện Dược Sư đế quốc quy tụ anh tài. Tiêu Viêm dùng Thanh Liên Địa Tâm Hỏa nung chảy đan dược ba đường vân!','Đoạt Quán Quân Đại Hội! Danh tiếng Nham Kiêu vang dội khắp Gia Mã.',{gold:4000,exp:X(26),pots:8}),
q('c2q12','Khử Độc Nạp Lan Kiệt','Tiến vào Hắc Giác Vực hạ 25 Sát Thủ tìm linh dược.',{t:'kill',m:'satt',n:25},'Nạp Lan lão gia tử trúng Lạc Độc chí mạng. Tiêu Viêm dùng Dị Hỏa thanh lọc độc tố để đoạt lấy Thất Huyễn Thanh Linh Diên.','Độc tố tiêu trừ, linh hồn Dược Lão được hồi phục một phần quan trọng.',{gold:4500,exp:X(27),rec:'pc2',item:{s:'w',t:7,q:2}}),
q('c2q13','Đột Phá Đại Đấu Sư','Đạt Đại Đấu Sư 1 tinh (cấp 27).',{t:'lv',v:27},'Dược Lão: "Đấu khí hóa thành chất lỏng tụ trong đan điền. Ngươi đã chính thức bước vào Đại Đấu Sư!"','Đấu khí lỏng ngưng tụ, khí tức uy mãnh vô song!',{gold:6000,exp:X(27),sk:'pnhl'}),
q('c2q14','Trảm Sát Hắc Giác Vực Chủ','Hạ gục Hắc Giác Vực Chủ (Boss hung hãn).',{t:'kill',m:'hgc',n:1},'Vực Chủ thống lĩnh hắc bang vung cự đao chém tới, đấu khí cuồng bạo ngập trời.','Phật Nộ Hỏa Liên sơ khai bộc phát! Vực Chủ tan biến thành tro bụi.',{gold:10000,exp:X(31),item:{s:'a',t:7,q:3}}),
q('c2q15','Ba Năm Chi Ước - Quyết Chiến','Hạ 20 Ma Thú Hắc Giác chuẩn bị lên đỉnh Vân Lam.',{t:'kill',m:'ma',n:20},'Hạn định ba năm đã tới. Thiếu niên năm xưa vác Huyền Trọng Xích từng bước bước lên thềm đá Vân Lam Tông!','Nạp Lan Yên Nhiên bại trận dưới tay Phật Nộ Hỏa Liên, lời thề ba năm rửa sạch!',{gold:8000,exp:X(32),pots:10}),
q('c2q16','Vân Lăng Giở Trò','Hạ gục Vân Lam Tông Đại Trưởng Lão chặn đường (Đại Boss).',{t:'kill',m:'vlt',n:1},'Đại Trưởng Lão Vân Lăng thẹn quá hóa giận kết trận vây giết Tiêu Viêm!','Vân Lăng trọng thương! Tiêu Viêm một mình náo loạn toàn bộ tông môn!',{gold:18000,exp:X(34),item:{s:'c',t:8,q:4}}),
q('c2q17','Lão Tổ Vân Sơn Xuất Quan','Đạt Đại Đấu Sư 9 tinh (cấp 35), khép lại Chương 2.',{t:'lv',v:35},'Đấu Tông Vân Sơn xuất hiện phong tỏa không gian. Dược Lão hao tổn linh hồn phá vây đưa Tiêu Viêm rời đi!','Hết Chương 2! Trốn chạy ngàn dặm hướng về Già Nam Học Viện.',{gold:25000,exp:0,pots:15})
]});})();

q('c3q4','Đánh Bại Sa Thiết','Hạ Đội Trưởng Hắc Sát Sa Thiết (Boss).',{t:'kill',m:'sathe',n:1},'Sa Thiết khoác chiến giáp nặng ngàn cân, kình lực bá đạo chặn ngay lối ra rừng rậm.','Bát Cực Băng ám kình bộc phát làm nứt toác giáp sắt! Đoạt trọn vẹn Hỏa Năng của Lão Sinh!',{gold:20000,exp:X(40),item:{s:'w',t:10,q:2}}),
q('c3q5','Bạch Sát La Hầu','Đánh bại Bạch Sát Lĩnh Đội La Hầu đoạt cờ quán quân.',{t:'kill',m:'lahau',n:1},'La Hầu với hàn băng đấu khí sắc lẹm nghênh chiến thiếu niên mang xích đen.','Cả hai đại đội Hắc Bạch Song Sát đều thất thủ trước Tiêu Viêm!',{gold:22000,exp:X(41),rec:'plt',pots:6}),
q('c3q6','Khai Sáng Bàn Môn','Luyện 3 viên Thanh Chấn Đan thiết lập căn cơ bang phái.',{t:'craft',m:'tcd',n:3},'Tiến vào Nội Viện, Tiêu Viêm cùng Huân Nhi, Ngô Hạo, Hổ Gia cùng sáng lập thế lực riêng: Bàn Môn!','Bàn Môn danh chấn tứ phương, đệ tử gia nhập đông như trẩy hội.',{gold:18000,exp:X(42),rec:'tcd',pots:8}),
